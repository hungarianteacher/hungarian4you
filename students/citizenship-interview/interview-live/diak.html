<style>
  :root{
    --cream:#FAF4E6; --paper:#FFFDF8; --ink:#2B241D; --soft:#6B6155;
    --red:#B6371F; --red-deep:#7E2513; --green:#2F6E4F; --line:#E4D9BF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden;}
  body{
    background:radial-gradient(ellipse at 50% 38%, #FFFDF8 0%, #F6EEDB 55%, #EADFC4 100%);
    color:var(--ink); font-family:'Work Sans',sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  #stage{ width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  #face{ height:min(96vh, 130vw); width:auto; max-width:100vw; display:block; }

  /* subtitles */
  #subs{
    position:fixed; left:50%; bottom:5vh; transform:translateX(-50%);
    width:min(1100px, 92vw); text-align:center;
    background:rgba(255,253,248,.94); border:1px solid var(--line); border-radius:18px;
    padding:18px 28px; box-shadow:0 16px 40px -24px rgba(40,25,10,.55);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #subs.show{ opacity:1; }
  #subs .hu{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(22px, 3.4vw, 44px); line-height:1.2; color:var(--ink); }
  #subs .en{ font-size:clamp(14px, 1.7vw, 22px); font-style:italic; color:var(--soft); margin-top:8px; }
  #subs .en:empty{ display:none; }

  /* start overlay (only the teacher sees this, before sharing) */
  #start{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(250,244,230,.88); backdrop-filter:blur(4px); cursor:pointer; z-index:10;
  }
  #start .card{
    background:var(--paper); border:1px solid var(--line); border-top:6px solid var(--red);
    border-radius:14px; padding:34px 40px; max-width:560px; text-align:center;
    box-shadow:0 20px 50px -30px rgba(40,25,10,.6);
  }
  #start h1{ font-family:'Fraunces',serif; font-weight:600; color:var(--red-deep); margin:0 0 10px; font-size:30px; }
  #start p{ margin:8px 0; color:var(--soft); line-height:1.5; }
  #start .go{ display:inline-block; margin-top:14px; background:var(--red-deep); color:#fff; font-weight:600; padding:12px 26px; border-radius:30px; }
  #start.hidden{ display:none; }

  /* tiny connection dot – fades out once connected */
  #dot{ position:fixed; top:14px; right:16px; width:10px; height:10px; border-radius:50%; background:#C9BFA8; transition:opacity 1.5s ease, background .3s; }
  #dot.on{ background:#2F6E4F; opacity:0; }

  /* face parts */
  .eyelid{ transform-box:fill-box; transform-origin:center; transition:transform .07s linear; }
  .blink .eyelid{ transform:scaleY(.08); }
  .face{ opacity:0; transition:opacity .45s ease; }
  .face.on{ opacity:1; }
</style>
</head>

<div id="start">
  <div class="card">
    <h1>Diák képernyő</h1>
    <p>Kattintson ide egyszer, hogy a böngésző engedélyezze a hangot.</p>
    <p>Utána ezt az ablakot ossza meg az online órán <b>hanggal együtt</b>, és a kérdéseket a tanári vezérlőből indítsa.</p>
    <p style="font-size:14px">Teljes képernyő: <b>F</b> billentyű vagy dupla kattintás.</p>
    <span class="go">Indítás</span>
  </div>

<audio id="playerLocal" preload="auto"></audio>
<audio id="playerRemote" preload="auto"></audio>

<script>
/* =========================================================================
   Hungarian4You – live interview practice, STUDENT screen
   Receives commands from the teacher page (tanar.html) in the same browser
   (BroadcastChannel + window.postMessage) and plays the question audio.
   The mouth follows the loudness of the audio.
   ========================================================================= */
const CHANNEL = "h4y-interview-live";

const $ = id => document.getElementById(id);
const startEl = $("start"), subsEl = $("subs"), dotEl = $("dot");
const subsHu = subsEl.querySelector(".hu"), subsEn = subsEl.querySelector(".en");
const playerLocal = $("playerLocal"), playerRemote = $("playerRemote");

/* ---------- messaging ---------- */
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(CHANNEL) : null;
const seen = [];
function send(msg){
  msg.from = "student"; msg.id = Math.random().toString(36).slice(2);
  if(bc) bc.postMessage(msg);
  if(window.opener && !window.opener.closed){ try{ window.opener.postMessage(msg, "*"); }catch(e){} }
}
function receive(msg){
  if(!msg || msg.from !== "teacher" || !msg.id) return;
  if(seen.includes(msg.id)) return;
  seen.push(msg.id); if(seen.length > 60) seen.shift();
  lastContact = Date.now(); dotEl.classList.add("on");
  switch(msg.type){
    case "ping": send({type:"pong", ready: unlocked, state: currentState, version: STUDENT_VERSION, tts: !!pickVoice("f"), face: activeFace}); break;
    case "face": if(currentState !== "playing") setFace(msg.g); break;
    case "play": play(msg); break;
    case "stop": stopAudio(true); break;
    case "speak": speak(msg); break;
    case "subs": setSubs(msg.mode); break;
  }
}
if(bc) bc.onmessage = e => receive(e.data);
window.addEventListener("message", e => { if(e.source === window.opener) receive(e.data); });
let lastContact = 0;
setInterval(()=>{ if(Date.now() - lastContact > 6000) dotEl.classList.remove("on"); }, 2000);

/* ---------- audio ---------- */
let audioCtx = null, analyser = null, timeData = null, unlocked = false;
let currentState = "idle", current = null, synthetic = false;

const STUDENT_VERSION = "2026-11-17a";
window.H4Y_STUDENT_VERSION = STUDENT_VERSION;
const SILENT = "data:audio/wav;base64,UklGRtQEAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YbAEAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=";

function unlock(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      const src = audioCtx.createMediaElementSource(playerLocal);   // same-origin files only
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.35;
      src.connect(analyser); analyser.connect(audioCtx.destination);
      timeData = new Uint8Array(analyser.fftSize);
    }
    audioCtx.resume();
  }catch(e){ audioCtx = null; analyser = null; }
  // Play a short silent sound on both players inside this click,
  // so every browser (also Safari) allows them to play later.
  [playerLocal, playerRemote].forEach(p=>{
    try{ p.src = SILENT; const pr = p.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
  });
  unlocked = true;
  startEl.classList.add("hidden");
  send({type:"hello", ready:true});
}
startEl.addEventListener("click", unlock);

// When the teacher page creates this screen itself (about:blank window),
// the real origin is the teacher page's origin.
function pageOrigin(){
  if(location.protocol === "about:" && window.opener){ try{ return window.opener.location.origin; }catch(e){ return ""; } }
  return location.origin;
}
function sameOrigin(url){
  try{ const o = pageOrigin(); const u = new URL(url, o.startsWith("http") ? o + "/" : location.href); return o.startsWith("http") && u.origin === o; }
  catch(e){ return false; }
}
function activePlayer(){ return synthetic ? playerRemote : playerLocal; }

function setState(s, extra){
  currentState = s;
  send(Object.assign({type:"state", state:s, n: current ? current.n : null, a: current ? current.a : null}, extra || {}));
}

let playToken = 0, watchdog = null;
function routedOk(src){
  return !!(analyser && audioCtx && audioCtx.state === "running" && sameOrigin(src));
}
function play(msg){
  stopAudio(false);
  current = msg;
  setFace(msg.g);
  showSubsText(msg.hu, msg.en);
  attempt(msg, routedOk(msg.src), ++playToken);
}
// try to play; if it fails with the analysed player, try once more with the plain one
function attempt(msg, routed, token){
  clearTimeout(watchdog);
  synthetic = !routed;
  const p = activePlayer();
  p.dataset.token = token;
  p.src = msg.src;
  p.playbackRate = msg.rate || 1;
  if("preservesPitch" in p) p.preservesPitch = true;
  if(audioCtx && audioCtx.state !== "running") audioCtx.resume().catch(()=>{});
  let pr;
  try{ pr = p.play(); }catch(err){ return failed(msg, routed, token, err); }
  if(pr && pr.catch) pr.catch(err => failed(msg, routed, token, err));
  watchdog = setTimeout(()=>{
    if(token !== playToken || currentState === "playing" || currentState === "ended") return;
    if(routed) attempt(msg, false, token);
    else setState("error", {detail:"időtúllépés (timeout)"});
  }, 5000);
}
function failed(msg, routed, token, err){
  if(token !== playToken) return;
  const name = (err && err.name) || "Error";
  if(name === "AbortError") return;               // replaced by a newer request
  if(name === "NotAllowedError"){
    clearTimeout(watchdog);
    startEl.classList.remove("hidden"); unlocked = false;
    setState("blocked"); return;
  }
  if(routed){ attempt(msg, false, token); return; }
  clearTimeout(watchdog);
  setState("error", {detail: name === "NotSupportedError" ? "a hangfájl nem található vagy nem lejátszható" : name + (err && err.message ? ": " + err.message : "")});
}
/* ---------- machine voice for questions without a recording ---------- */
let ttsActive = false;
const MALE_RE = /(szabolcs|tamás|tamas|máté|mate\b|péter|peter|gábor|gabor|male|férfi|ferfi)/i;
const FEMALE_RE = /(noémi|noemi|mariska|tünde|tunde|anna|female|női|noi\b)/i;
function huVoices(){ return ("speechSynthesis" in window) ? speechSynthesis.getVoices().filter(v => /^hu(-|_|$)/i.test(v.lang)) : []; }
// returns {voice, pitch}; if there is no male Hungarian voice, a lower pitch is used
function pickVoice(g){
  const vs = huVoices(); if(!vs.length) return null;
  if(g === "m"){
    const m = vs.find(v => MALE_RE.test(v.name));
    if(m) return {voice:m, pitch:1};
    return {voice: vs.find(v => !FEMALE_RE.test(v.name) && !/google/i.test(v.name)) || vs[0], pitch:0.7};
  }
  const f = vs.find(v => /google/i.test(v.name)) || vs.find(v => FEMALE_RE.test(v.name)) || vs.find(v => !MALE_RE.test(v.name));
  return f ? {voice:f, pitch:1} : {voice:vs[0], pitch:1.25};
}
if("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
function speak(msg){
  stopAudio(false);
  current = msg; ++playToken;
  setFace(msg.g);
  showSubsText(msg.hu, msg.en);
  if(!("speechSynthesis" in window)){ setState("error", {detail:"ez a böngésző nem tud gépi hangon beszélni"}); return; }
  const pv = pickVoice(msg.g);
  if(!pv){ setState("error", {detail:"nincs magyar gépi hang ezen a gépen"}); return; }
  const u = new SpeechSynthesisUtterance(msg.hu);
  u.voice = pv.voice; u.lang = pv.voice.lang || "hu-HU"; u.rate = (msg.rate || 1) * 0.95; u.pitch = pv.pitch;
  const token = playToken;
  u.onstart = () => { if(token === playToken){ ttsActive = true; setState("playing", {tts:true}); } };
  u.onend = () => { if(token === playToken){ ttsActive = false; setState("ended"); } };
  u.onerror = e => { if(token === playToken){ ttsActive = false; if(e.error !== "interrupted" && e.error !== "canceled") setState("error", {detail:"gépi hang hiba: " + e.error}); } };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function stopAudio(report){
  clearTimeout(watchdog);
  if(ttsActive || ("speechSynthesis" in window && speechSynthesis.speaking)){ ttsActive = false; try{ speechSynthesis.cancel(); }catch(e){} }
  [playerLocal, playerRemote].forEach(p=>{ try{ p.pause(); p.currentTime = 0; }catch(e){} });
  if(report) setState("stopped");
}
[playerLocal, playerRemote].forEach(p=>{
  const mine = () => p === activePlayer() && Number(p.dataset.token) === playToken;
  p.addEventListener("playing", ()=>{ if(mine()){ clearTimeout(watchdog); setState("playing"); } });
  p.addEventListener("ended",   ()=>{ if(mine()) setState("ended"); });
  p.addEventListener("error",   ()=>{
    if(!mine() || !p.getAttribute("src") || p.src.startsWith("data:")) return;
    clearTimeout(watchdog);
    const code = p.error ? p.error.code : 0;
    if(code === 4 || code === 2) setState("error", {detail: code === 4 ? "a hangfájl nem található" : "hálózati hiba"});
    else setState("error", {detail:"lejátszási hiba (" + code + ")"});
  });
});

/* ---------- subtitles ---------- */
let subsMode = "off"; // off | hu | huen
function setSubs(mode){ subsMode = mode || "off"; renderSubs(); }
function showSubsText(hu, en){ subsHu.textContent = hu || ""; subsEn.dataset.text = en || ""; renderSubs(); }
function renderSubs(){
  subsEn.textContent = subsMode === "huen" ? (subsEn.dataset.text || "") : "";
  subsEl.classList.toggle("show", subsMode !== "off" && !!subsHu.textContent);
}

/* ---------- face animation (two faces: woman "f", man "m") ---------- */
function makeFace(id, mw){
  const root = $(id), q = sel => root.querySelector(sel);
  return { root, mw, head:q(".head"), eyes:q(".eyes"), brows:q(".brows"), closed:q(".closed"), openG:q(".open"),
    inner:q(".inner"), lips:q(".lips"), clipP:q(".clipp"), teeth:q(".teeth"), tongue:q(".tongue"),
    irises: root.querySelectorAll(".iris"), level:0 };
}
const FACES = { f: makeFace("faceF", 36), m: makeFace("faceM", 42) };
let activeFace = "f";
function setFace(g){
  g = g === "m" ? "m" : "f";
  activeFace = g;
  Object.keys(FACES).forEach(k => FACES[k].root.classList.toggle("on", k === g));
}

let synthTarget = 0, synthNext = 0;
let gaze = {x:0, y:0, tx:0, ty:0, next:0};

function loudness(){
  if(ttsActive){
    const now = performance.now();
    if(now > synthNext){ synthTarget = Math.random() < 0.18 ? 0.05 : 0.35 + Math.random() * 0.65; synthNext = now + 110 + Math.random() * 140; }
    return synthTarget;
  }
  const p = activePlayer();
  const speaking = !p.paused && !p.ended && p.currentTime > 0;
  if(!speaking) return 0;
  if(!synthetic && analyser){
    analyser.getByteTimeDomainData(timeData);
    let sum = 0;
    for(let i = 0; i < timeData.length; i++){ const v = (timeData[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / timeData.length);
    return Math.min(1, Math.max(0, (rms - 0.012) * 7.5));
  }
  // cross-origin audio cannot be analysed: imitate syllables (~5 per second)
  const now = performance.now();
  if(now > synthNext){
    synthTarget = Math.random() < 0.18 ? 0.05 : 0.35 + Math.random() * 0.65;
    synthNext = now + 110 + Math.random() * 140;
  }
  return synthTarget;
}

function mouthPath(w, top, bottom){
  return `M${-w},0 Q0,${-top} ${w},0 Q0,${bottom} ${-w},0 Z`;
}

function drawFace(F, target, t){
  // fast opening, slower closing – looks like real speech
  F.level += (target - F.level) * (target > F.level ? 0.55 : 0.22);
  const o = F.level;
  const w = F.mw - 8 * o;
  const top = 3 + 9 * o;
  const bottom = 8 + 60 * o;
  const d = mouthPath(w, top, bottom);
  F.inner.setAttribute("d", d); F.lips.setAttribute("d", d); F.clipP.setAttribute("d", d);
  F.teeth.setAttribute("x", -w * 0.8); F.teeth.setAttribute("width", w * 1.6);
  F.teeth.setAttribute("y", -top - 2); F.teeth.setAttribute("height", Math.min(12, 4 + bottom * 0.18));
  F.tongue.setAttribute("cy", bottom * 0.78); F.tongue.setAttribute("rx", w * 0.6); F.tongue.setAttribute("ry", 6 + bottom * 0.16);
  const vis = Math.min(1, o * 5);
  F.openG.setAttribute("opacity", vis.toFixed(2));
  F.closed.setAttribute("opacity", (1 - vis).toFixed(2));

  const s = t / 1000;
  const breathe = Math.sin(s * 1.6) * 2.2;
  const nod = Math.sin(s * 7.3) * 1.6 * o;
  const tilt = Math.sin(s * 0.5) * 1.2 + Math.sin(s * 2.1) * 0.8 * o;
  F.head.setAttribute("transform", `translate(0 ${(breathe + nod).toFixed(2)}) rotate(${tilt.toFixed(2)} 400 470)`);
  F.brows.setAttribute("transform", `translate(0 ${(-4 * o).toFixed(2)})`);
  F.irises.forEach(i => i.setAttribute("transform", `translate(${gaze.x.toFixed(2)} ${gaze.y.toFixed(2)})`));
}

function frame(t){
  const target = loudness();
  if(t > gaze.next){
    const r = Math.random();
    gaze.tx = r < 0.6 ? 0 : (Math.random() * 8 - 4);
    gaze.ty = r < 0.6 ? 0 : (Math.random() * 4 - 2);
    gaze.next = t + 1500 + Math.random() * 3000;
  }
  gaze.x += (gaze.tx - gaze.x) * 0.12; gaze.y += (gaze.ty - gaze.y) * 0.12;
  Object.keys(FACES).forEach(k => drawFace(FACES[k], k === activeFace ? target : 0, t));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// blinking (both faces)
(function blinkLoop(){
  setTimeout(()=>{
    Object.values(FACES).forEach(F => F.eyes.classList.add("blink"));
    setTimeout(()=>{ Object.values(FACES).forEach(F => F.eyes.classList.remove("blink")); blinkLoop(); }, 130);
  }, 2400 + Math.random() * 3600);
})();

/* ---------- fullscreen ---------- */
function toggleFs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen && document.exitFullscreen();
}
document.addEventListener("keydown", e => { if(e.key === "f" || e.key === "F") toggleFs(); });
document.addEventListener("dblclick", e => { if(!startEl.contains(e.target)) toggleFs(); });

send({type:"hello", ready:false});
</script>
